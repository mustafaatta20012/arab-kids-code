version: '3.8'

services:
  # Express API backend service
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/arab_kids_code
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:3000
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    depends_on:
      - mongo
      - redis
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/shared:/app/packages/shared
    restart: unless-stopped

  # React Frontend Vite app service
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: arab_kids_code_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=arab_kids_code
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # Redis Cache & Rate Limiting Store
  redis:
    image: redis:7-alpine
    container_name: arab_kids_code_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Local Email Testing Sandbox
  mailhog:
    image: mailhog/mailhog
    container_name: arab_kids_code_mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web GUI
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
