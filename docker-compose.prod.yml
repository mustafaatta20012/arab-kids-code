version: '3.8'

services:
  # Node.js API Service
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: arabkidscode_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - CLIENT_URL=${CLIENT_URL:-https://arabkidscode.com}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - INSTRUCTOR_WHATSAPP=${INSTRUCTOR_WHATSAPP:-+201101587881}
      - FRONTEND_SECURE_COOKIE=true
    expose:
      - "5000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Frontend & Reverse Proxy
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        - VITE_API_URL=/api/v1
    container_name: arabkidscode_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
